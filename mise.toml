[settings]
lockfile = true

[tools]
go = "1.25.11"
golangci-lint = "2.12.2"
git-cliff = "2.13.1"
node = "24"
"npm:@openai/codex" = "0.146.0"
"npm:quicktype" = "26.0.0"

[tasks.test]
description = "Run tests for all Go modules"
run = "go test ./buildinfo/... ./config/... ./dbmigrate/... ./debugserver/... ./di/... ./filesystem/... ./grpcclient/... ./grpcserver/... ./grpczap/... ./health/... ./healthgrpc/... ./healthotel/... ./healthserver/... ./healthzap/... ./kafka/... ./kafkaoutbox/... ./kafkaoutboxzap/... ./kafkaproto/... ./kafkazap/... ./lifecycle/... ./log/... ./oapivalidator/... ./oapivalidatorjwt/... ./oidcsession/... ./oidcsessionredis/... ./postgresdb/... ./retry/... ./sqlitedb/... ./telemetry/... ./txmanager/..."

[tasks.lint]
description = "Run golangci-lint for all Go modules"
run = "golangci-lint run ./buildinfo/... ./config/... ./dbmigrate/... ./debugserver/... ./di/... ./filesystem/... ./grpcclient/... ./grpcserver/... ./grpczap/... ./health/... ./healthgrpc/... ./healthotel/... ./healthserver/... ./healthzap/... ./kafka/... ./kafkaoutbox/... ./kafkaoutboxzap/... ./kafkaproto/... ./kafkazap/... ./lifecycle/... ./log/... ./oapivalidator/... ./oapivalidatorjwt/... ./oidcsession/... ./oidcsessionredis/... ./postgresdb/... ./retry/... ./sqlitedb/... ./telemetry/... ./txmanager/..."

[tasks."test:race"]
description = "Run race-enabled tests for all Go modules"
run = "go test -race ./buildinfo/... ./config/... ./dbmigrate/... ./debugserver/... ./di/... ./filesystem/... ./grpcclient/... ./grpcserver/... ./grpczap/... ./health/... ./healthgrpc/... ./healthotel/... ./healthserver/... ./healthzap/... ./kafka/... ./kafkaoutbox/... ./kafkaoutboxzap/... ./kafkaproto/... ./kafkazap/... ./lifecycle/... ./log/... ./oapivalidator/... ./oapivalidatorjwt/... ./oidcsession/... ./oidcsessionredis/... ./postgresdb/... ./retry/... ./sqlitedb/... ./telemetry/... ./txmanager/..."

[tasks."oidcsessionredis:test-integration"]
description = "Run race-enabled Redis session integration tests"
run = "go test -race -tags=integration ./oidcsessionredis/..."

[tasks."dbmigrate:test-integration"]
description = "Run PostgreSQL and ClickHouse migration integration tests"
run = "go test -race -tags=integration ./dbmigrate/..."

[tasks."postgresdb:test-integration"]
description = "Run race-enabled PostgreSQL integration tests"
run = "go test -race -tags=integration ./postgresdb/..."

[tasks."kafkaoutbox:test-integration"]
description = "Run race-enabled PostgreSQL outbox integration tests"
run = "go test -race -tags=integration ./kafkaoutbox/..."

[tasks.generate]
description = "Refresh all checked-in generated Go artifacts"
run = "go generate ./config/... ./filesystem/... ./grpcserver/... ./health/... ./healthserver/... ./kafka/... ./kafkaoutbox/... ./oapivalidator/... ./oidcsession/... ./oidcsessionredis/... ./txmanager/..."

[tasks."check-generated"]
description = "Verify all checked-in generated Go artifacts"
run = """
mise run generate
git diff --exit-code
"""
