name: Release module

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to release.
        required: true
        type: choice
        options: [codexapp, config, debugserver, di, filesystem, health, healthotel, healthserver, healthzap, lifecycle, log, oapivalidator, postgresdb, sqlitedb, telemetry, txmanager]
      bump:
        description: Stable semantic-version increment.
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: test "$SELECTED_BRANCH" = "$DEFAULT_BRANCH"

  validate:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      force_go_ci: true
      run_postgres_integration: ${{ inputs.module == 'postgresdb' || inputs.module == 'txmanager' }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ inputs.module }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@v4
      - name: Compute release
        id: release
        run: |
          set -euo pipefail
          next_tag="$(python3 .github/scripts/compute_release.py --module "$MODULE" --bump "$BUMP" --require-new-commits --require-absent-tag)"
          previous_tag="$(python3 .github/scripts/compute_release.py --module "$MODULE" --bump "$BUMP" --previous)"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Verify module outside the workspace
        run: |
          cd "$MODULE"
          GOWORK=off go mod download
          GOWORK=off go test -race ./...
      - name: Generate release notes
        env:
          NEXT_TAG: ${{ steps.release.outputs.next_tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          range=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range=("$PREVIOUS_TAG..HEAD")
          fi
          git-cliff "${range[@]}" \
            --include-path "$MODULE/**" \
            --tag-pattern "^${MODULE}/v[0-9]+\\.[0-9]+\\.[0-9]+$" \
            --tag "$NEXT_TAG" \
            --output release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.next_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.next_tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
